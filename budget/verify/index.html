<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d32f2f"><link rel="icon" href="/icons/icon-192.png"><meta name="robots" content="noindex,nofollow"><title>ตรวจสอบรายการ · Budget</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#111827;font-family:'Noto Sans Thai',sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:min(520px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px 20px;box-shadow:0 8px 28px #0000000a}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b7280}h1{margin:8px 0 20px;font-size:28px}.status{padding:12px 14px;border-radius:10px;background:#f3f4f6;margin-bottom:18px}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.label{color:#6b7280;font-size:13px}.value{text-align:right;font-weight:700}a{color:#111827}.error{color:#b91c1c}</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">Budget Verification</div><h1>ตรวจสอบรายการธุรกรรม</h1><div id="status" class="status">กำลังตรวจสอบ…</div><div id="details"></div></section></main><script>const API='https://engedlru-api.stnetworld.workers.dev';const q=new URLSearchParams(location.search);const id=q.get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){if(!id){status.className='status error';status.textContent='ไม่พบ Transaction ID';return}try{const r=await fetch(API+'/budget/verify/'+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.valid){status.className='status error';status.textContent=d.message||'ไม่พบรายการธุรกรรม';return}status.textContent='รายการนี้ได้รับการตรวจสอบแล้ว';const t=d.transaction;details.innerHTML='<div class="row"><span class="label">Transaction ID</span><span class="value">'+esc(t.transactionId)+'</span></div><div class="row"><span class="label">บัญชี</span><span class="value">'+esc(t.account)+'</span></div><div class="row"><span class="label">ประเภท</span><span class="value">'+esc(t.type==='income'?'เงินเข้า':'เงินออก')+'</span></div><div class="row"><span class="label">หมวดหมู่</span><span class="value">'+esc(t.category)+'</span></div><div class="row"><span class="label">จำนวนเงิน</span><span class="value">฿'+Number(t.amount).toLocaleString('th-TH',{minimumFractionDigits:2})+'</span></div><div class="row"><span class="label">วันที่</span><span class="value">'+esc(t.createdAt)+'</span></div><div class="row"><span class="label">สถานะ</span><span class="value">'+esc(t.status)+'</span></div>'}catch(e){status.className='status error';status.textContent='ไม่สามารถเชื่อมต่อระบบตรวจสอบได้'}}run();</script></body></html>
