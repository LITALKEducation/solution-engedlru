name: Admin media manager migration
on:
  push:
    branches: ["improve/admin-data-workflow"]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/admin-data-workflow
      - name: Apply media manager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # D1 schema: homepage advertisements
          schema = Path('worker/schema.sql')
          s = schema.read_text()
          block = '''\n\n-- ── Homepage advertisements / announcement media ──\nCREATE TABLE IF NOT EXISTS site_ads (\n  id         INTEGER PRIMARY KEY AUTOINCREMENT,\n  title      TEXT,\n  image_key  TEXT NOT NULL,\n  mime       TEXT NOT NULL,\n  link_url   TEXT,\n  active     INTEGER NOT NULL DEFAULT 1,\n  sort_order INTEGER NOT NULL DEFAULT 0,\n  created_at TEXT NOT NULL DEFAULT (datetime('now')),\n  updated_at TEXT NOT NULL DEFAULT (datetime('now'))\n);\nCREATE INDEX IF NOT EXISTS idx_site_ads_active_sort ON site_ads (active, sort_order, id);\n'''
          if 'CREATE TABLE IF NOT EXISTS site_ads' not in s:
              schema.write_text(s + block)

          # Worker media handler
          media = Path('worker/src/handlers/media.js')
          media.write_text(r'''const ALLOWED_IMAGE_TYPES = new Set(["image/jpeg", "image/png", "image/webp", "image/gif"]);
          const MAX_IMAGE_BYTES = 8 * 1024 * 1024;

          function cleanFilename(name = "image") {
            return String(name).toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || "image";
          }

          function validateImage(file) {
            if (!file || typeof file.arrayBuffer !== "function") throw new Error("Image file is required");
            if (!ALLOWED_IMAGE_TYPES.has(file.type)) throw new Error("Unsupported image type. Use JPG, PNG, WebP or GIF");
            if (file.size > MAX_IMAGE_BYTES) throw new Error("Image must be 8 MB or smaller");
          }

          async function putImage(env, file, prefix) {
            validateImage(file);
            const key = `${prefix}/${crypto.randomUUID()}-${cleanFilename(file.name)}`;
            await env.FILES.put(key, await file.arrayBuffer(), {
              httpMetadata: { contentType: file.type, cacheControl: "public, max-age=31536000, immutable" }
            });
            return key;
          }

          export async function serveMedia(request, env, id) {
            const row = await env.DB.prepare("SELECT image_key, mime FROM site_ads WHERE id = ? LIMIT 1").bind(id).first();
            if (!row) return new Response("Not Found", { status: 404 });
            const object = await env.FILES.get(row.image_key);
            if (!object) return new Response("Not Found", { status: 404 });
            const headers = new Headers();
            object.writeHttpMetadata(headers);
            headers.set("Content-Type", row.mime || headers.get("Content-Type") || "application/octet-stream");
            headers.set("Cache-Control", "public, max-age=3600, stale-while-revalidate=86400");
            headers.set("Access-Control-Allow-Origin", "*");
            return new Response(object.body, { headers });
          }

          export async function listPublicAds(request, env) {
            const { results = [] } = await env.DB.prepare("SELECT id, title, link_url, sort_order, updated_at FROM site_ads WHERE active = 1 ORDER BY sort_order ASC, id DESC").all();
            const origin = new URL(request.url).origin;
            return results.map(row => ({ ...row, image_url: `${origin}/media/ads/${row.id}` }));
          }

          export async function listAdminAds(request, env) {
            const { results = [] } = await env.DB.prepare("SELECT id, title, image_key, mime, link_url, active, sort_order, created_at, updated_at FROM site_ads ORDER BY sort_order ASC, id DESC").all();
            const origin = new URL(request.url).origin;
            return results.map(row => ({ ...row, image_url: `${origin}/media/ads/${row.id}` }));
          }

          export async function uploadOgImage(request, env) {
            const form = await request.formData();
            const page = String(form.get("page") || "").trim().toLowerCase();
            const file = form.get("file");
            if (!/^[a-z0-9/_-]{1,80}$/.test(page)) throw new Error("Invalid OG page key");
            const existing = await env.DB.prepare("SELECT image_key FROM site_og_images WHERE page = ? LIMIT 1").bind(page).first();
            const key = await putImage(env, file, `og/${page}`);
            await env.DB.prepare(`INSERT INTO site_og_images (page, image_key, mime, updated_at) VALUES (?, ?, ?, datetime('now')) ON CONFLICT(page) DO UPDATE SET image_key = excluded.image_key, mime = excluded.mime, updated_at = datetime('now')`).bind(page, key, file.type).run();
            if (existing?.image_key && existing.image_key !== key) await env.FILES.delete(existing.image_key).catch(() => {});
            return { ok: true, page, image_key: key, mime: file.type };
          }

          export async function uploadAd(request, env) {
            const form = await request.formData();
            const file = form.get("file");
            const title = String(form.get("title") || "").trim().slice(0, 160) || null;
            const linkUrl = String(form.get("link_url") || "").trim().slice(0, 1500) || null;
            const active = String(form.get("active") || "1") === "0" ? 0 : 1;
            const sortOrder = Number.parseInt(String(form.get("sort_order") || "0"), 10) || 0;
            if (linkUrl && !/^https?:\/\//i.test(linkUrl)) throw new Error("Advertisement link must start with http:// or https://");
            const key = await putImage(env, file, "ads/home");
            const result = await env.DB.prepare("INSERT INTO site_ads (title, image_key, mime, link_url, active, sort_order) VALUES (?, ?, ?, ?, ?, ?)").bind(title, key, file.type, linkUrl, active, sortOrder).run();
            return { ok: true, id: result.meta?.last_row_id, image_key: key };
          }

          export async function updateAd(request, env, id) {
            const body = await request.json();
            const existing = await env.DB.prepare("SELECT id FROM site_ads WHERE id = ? LIMIT 1").bind(id).first();
            if (!existing) throw new Error("Advertisement not found");
            const title = body.title == null ? null : String(body.title).trim().slice(0, 160) || null;
            const linkUrl = body.link_url == null ? null : String(body.link_url).trim().slice(0, 1500) || null;
            if (linkUrl && !/^https?:\/\//i.test(linkUrl)) throw new Error("Advertisement link must start with http:// or https://");
            const active = body.active ? 1 : 0;
            const sortOrder = Number.parseInt(String(body.sort_order ?? 0), 10) || 0;
            await env.DB.prepare("UPDATE site_ads SET title = ?, link_url = ?, active = ?, sort_order = ?, updated_at = datetime('now') WHERE id = ?").bind(title, linkUrl, active, sortOrder, id).run();
            return { ok: true };
          }

          export async function deleteAd(request, env, id) {
            const row = await env.DB.prepare("SELECT image_key FROM site_ads WHERE id = ? LIMIT 1").bind(id).first();
            if (!row) return { ok: true };
            await env.DB.prepare("DELETE FROM site_ads WHERE id = ?").bind(id).run();
            await env.FILES.delete(row.image_key).catch(() => {});
            return { ok: true };
          }
          ''')

          # Worker router
          idx = Path('worker/src/index.js')
          t = idx.read_text()
          imp = 'import { listPublicAds, listAdminAds, uploadOgImage, uploadAd, updateAd, deleteAd, serveMedia } from "./handlers/media.js";'
          if imp not in t:
              t = t.replace('import { getOgImage, listOgImages, upsertOgImage } from "./handlers/og.js";', 'import { getOgImage, listOgImages, upsertOgImage } from "./handlers/og.js";\n' + imp)
          public_anchor = '      if (pathname === "/og/image" && request.method === "GET") {\n        return await getOgImage(request, env, url);\n      }\n'
          public_routes = '''\n      if (pathname === "/ads" && request.method === "GET") return json(request, env, await listPublicAds(request, env));\n      const mediaAdMatch = pathname.match(/^\\/media\\/ads\\/(\\d+)$/);\n      if (mediaAdMatch && request.method === "GET") return await serveMedia(request, env, mediaAdMatch[1]);\n'''
          if 'pathname === "/ads"' not in t:
              t = t.replace(public_anchor, public_anchor + public_routes)
          admin_anchor = '        if (pathname === "/admin/og-images" && request.method === "POST") return json(request, env, await upsertOgImage(request, env));'
          admin_routes = '''\n        if (pathname === "/admin/media/og/upload" && request.method === "POST") return json(request, env, await uploadOgImage(request, env));\n        if (pathname === "/admin/media/ads" && request.method === "GET") return json(request, env, await listAdminAds(request, env));\n        if (pathname === "/admin/media/ads" && request.method === "POST") return json(request, env, await uploadAd(request, env));\n        const mediaAdminAdMatch = pathname.match(/^\\/admin\\/media\\/ads\\/(\\d+)$/);\n        if (mediaAdminAdMatch && request.method === "PUT") return json(request, env, await updateAd(request, env, mediaAdminAdMatch[1]));\n        if (mediaAdminAdMatch && request.method === "DELETE") return json(request, env, await deleteAd(request, env, mediaAdminAdMatch[1]));\n'''
          if 'pathname === "/admin/media/og/upload"' not in t:
              t = t.replace(admin_anchor, admin_anchor + admin_routes)
          idx.write_text(t)

          # Admin navigation + media view
          admin = Path('admin.html')
          h = admin.read_text()
          old_nav = '<button class="nav-item" data-view="admins"><i class="fa-solid fa-user-shield"></i><span class="sidebar-label">จัดการแอดมิน</span></button>'
          if 'data-view="media"' not in h:
              h = h.replace(old_nav, '<button class="nav-item" data-view="media"><i class="fa-solid fa-photo-film"></i><span class="sidebar-label">สื่อเว็บไซต์</span></button>\n                        ' + old_nav)
          marker = '                    <!-- ═══ ADMINS ═══ -->'
          media_view = r'''                    <!-- ═══ WEBSITE MEDIA ═══ -->
                    <section class="view" id="view-media">
                        <div class="view-header"><div><div class="view-title">สื่อเว็บไซต์</div><div class="view-desc">อัปโหลดและจัดการรูป Open Graph และรูปโฆษณาที่แสดงบนหน้าหลัก</div></div></div>
                        <div class="media-admin-grid">
                            <div class="admin-card">
                                <div class="admin-card-title">Open Graph Image</div>
                                <div class="admin-card-desc">รูปตัวอย่างเมื่อแชร์ลิงก์ไปยัง LINE, Facebook, X และแพลตฟอร์มอื่น</div>
                                <form id="ogUploadForm" class="media-upload-form">
                                    <label class="admin-label">หน้า</label>
                                    <select class="admin-select" id="ogPageSelect" name="page"><option value="home">หน้าหลัก</option><option value="checkup">บันทึกกิจกรรม</option><option value="card">บัตรนักศึกษา</option><option value="sys">Token Key</option></select>
                                    <label class="admin-label">รูปภาพ</label>
                                    <input class="admin-input" id="ogImageFile" name="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
                                    <div class="media-help">รองรับ JPG, PNG, WebP, GIF · สูงสุด 8 MB · แนะนำ 1200×630 px</div>
                                    <button class="admin-btn primary" type="submit"><i class="fa-solid fa-cloud-arrow-up"></i> อัปโหลด / แทนที่รูป OG</button>
                                </form>
                                <div id="ogMediaList" class="media-list"></div>
                            </div>
                            <div class="admin-card">
                                <div class="admin-card-title">โฆษณา / ประกาศหน้าหลัก</div>
                                <div class="admin-card-desc">รูปที่เปิดใช้งานจะแสดงในสไลด์หน้าหลักตามลำดับที่กำหนด</div>
                                <form id="adUploadForm" class="media-upload-form">
                                    <input class="admin-input" name="title" placeholder="ชื่อหรือคำอธิบาย (ไม่บังคับ)">
                                    <input class="admin-input" name="link_url" type="url" placeholder="ลิงก์เมื่อคลิกรูป เช่น https://... (ไม่บังคับ)">
                                    <div class="admin-row"><input class="admin-input" name="sort_order" type="number" value="0" placeholder="ลำดับ"><label class="media-check"><input name="active" type="checkbox" checked> แสดงบนหน้าหลัก</label></div>
                                    <input class="admin-input" name="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
                                    <div class="media-help">รองรับ JPG, PNG, WebP, GIF · สูงสุด 8 MB</div>
                                    <button class="admin-btn primary" type="submit"><i class="fa-solid fa-cloud-arrow-up"></i> เพิ่มรูปโฆษณา</button>
                                </form>
                                <div id="adMediaList" class="media-list"></div>
                            </div>
                        </div>
                    </section>

'''
          if 'id="view-media"' not in h:
              h = h.replace(marker, media_view + marker)
          admin.write_text(h)

          # Admin JS
          js = Path('JavaScript/admin.js')
          j = js.read_text()
          j = j.replace("{ view: 'admins', label: 'จัดการแอดมิน', icon: 'fa-user-shield' }", "{ view: 'media', label: 'สื่อเว็บไซต์', icon: 'fa-photo-film' },\n    { view: 'admins', label: 'จัดการแอดมิน', icon: 'fa-user-shield' }")
          if "if (view === 'media') loadMediaTab();" not in j:
              j = j.replace("    if (view === 'admins') loadAdminsTab();", "    if (view === 'media') loadMediaTab();\n    if (view === 'admins') loadAdminsTab();")
          if '/* WEBSITE MEDIA MANAGER */' not in j:
              j += r'''

/* WEBSITE MEDIA MANAGER */
async function parseAdminResponse(res) {
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(data?.details || data?.error || `HTTP ${res.status}`);
    return data;
}

async function uploadAdminForm(path, formData) {
    const token = await auth0Client.getTokenSilently();
    const res = await fetch(`${API_BASE_URL}${path}`, { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: formData });
    return parseAdminResponse(res);
}

async function loadMediaTab() {
    const [ogRes, adsRes] = await Promise.all([adminFetch('/admin/og-images'), adminFetch('/admin/media/ads')]);
    const ogRows = await parseAdminResponse(ogRes);
    const ads = await parseAdminResponse(adsRes);
    renderOgMedia(ogRows || []);
    renderAdMedia(ads || []);
}

function renderOgMedia(rows) {
    const labels = { home: 'หน้าหลัก', checkup: 'บันทึกกิจกรรม', card: 'บัตรนักศึกษา', sys: 'Token Key' };
    const box = document.getElementById('ogMediaList');
    box.innerHTML = rows.length ? rows.map(r => `<div class="media-row"><img src="${API_BASE_URL}/og/image?page=${encodeURIComponent(r.page)}&v=${encodeURIComponent(r.updated_at || '')}" alt="${escHtmlAdmin(labels[r.page] || r.page)}"><div class="media-row-main"><strong>${escHtmlAdmin(labels[r.page] || r.page)}</strong><small>${escHtmlAdmin(r.image_key)}</small><small>อัปเดต ${escHtmlAdmin(r.updated_at || '—')}</small></div></div>`).join('') : '<div class="dt-empty"><i class="fa-regular fa-image"></i>ยังไม่มี OG image ในฐานข้อมูล</div>';
}

function renderAdMedia(rows) {
    const box = document.getElementById('adMediaList');
    box.innerHTML = rows.length ? rows.map(r => `<div class="media-row" data-ad-id="${r.id}"><img src="${escHtmlAdmin(r.image_url)}?v=${encodeURIComponent(r.updated_at || '')}" alt=""><div class="media-row-main"><strong>${escHtmlAdmin(r.title || `โฆษณา #${r.id}`)}</strong><small>${r.active ? 'กำลังแสดง' : 'ซ่อนอยู่'} · ลำดับ ${r.sort_order ?? 0}</small><small>${escHtmlAdmin(r.link_url || 'ไม่มีลิงก์')}</small></div><div class="media-row-actions"><button class="admin-btn sm" onclick="toggleAdMedia(${r.id}, ${r.active ? 'false' : 'true'}, ${r.sort_order ?? 0}, ${JSON.stringify(r.title || '')}, ${JSON.stringify(r.link_url || '')})"><i class="fa-solid ${r.active ? 'fa-eye-slash' : 'fa-eye'}"></i>${r.active ? 'ซ่อน' : 'แสดง'}</button><button class="admin-btn sm danger" onclick="deleteAdMedia(${r.id})"><i class="fa-solid fa-trash"></i></button></div></div>`).join('') : '<div class="dt-empty"><i class="fa-regular fa-image"></i>ยังไม่มีรูปโฆษณา</div>';
}

document.getElementById('ogUploadForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.currentTarget;
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    try { await uploadAdminForm('/admin/media/og/upload', new FormData(form)); showToast('อัปโหลด OG image สำเร็จ', 'success'); form.querySelector('[name="file"]').value = ''; await loadMediaTab(); }
    catch (err) { showToast(`อัปโหลดไม่สำเร็จ: ${err.message}`, 'error'); }
    finally { btn.disabled = false; }
});

document.getElementById('adUploadForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.currentTarget;
    const fd = new FormData(form);
    fd.set('active', form.querySelector('[name="active"]').checked ? '1' : '0');
    const btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
    try { await uploadAdminForm('/admin/media/ads', fd); showToast('เพิ่มรูปโฆษณาสำเร็จ', 'success'); form.reset(); form.querySelector('[name="active"]').checked = true; form.querySelector('[name="sort_order"]').value = '0'; await loadMediaTab(); }
    catch (err) { showToast(`อัปโหลดไม่สำเร็จ: ${err.message}`, 'error'); }
    finally { btn.disabled = false; }
});

async function toggleAdMedia(id, active, sortOrder, title, linkUrl) {
    try { await parseAdminResponse(await adminFetch(`/admin/media/ads/${id}`, { method: 'PUT', body: JSON.stringify({ active, sort_order: sortOrder, title, link_url: linkUrl }) })); showToast(active ? 'เปิดการแสดงโฆษณาแล้ว' : 'ซ่อนโฆษณาแล้ว', 'success'); await loadMediaTab(); }
    catch (err) { showToast(`อัปเดตไม่สำเร็จ: ${err.message}`, 'error'); }
}

async function deleteAdMedia(id) {
    if (!await confirmDialog({ title: 'ลบรูปโฆษณา', body: 'รูปจะถูกลบจากฐานข้อมูลและ R2 และไม่สามารถกู้คืนได้', okText: 'ลบรูป' })) return;
    try { await parseAdminResponse(await adminFetch(`/admin/media/ads/${id}`, { method: 'DELETE' })); showToast('ลบรูปโฆษณาแล้ว', 'success'); await loadMediaTab(); }
    catch (err) { showToast(`ลบไม่สำเร็จ: ${err.message}`, 'error'); }
}
'''
          js.write_text(j)

          # Admin CSS
          css = Path('CSS/admin.css')
          c = css.read_text()
          if '/* WEBSITE MEDIA MANAGER */' not in c:
              c += r'''

/* WEBSITE MEDIA MANAGER */
.media-admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}.media-upload-form{display:flex;flex-direction:column;gap:10px;margin:16px 0 20px}.media-help{font-size:11.5px;color:var(--ink-50)}.media-check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;white-space:nowrap}.media-list{display:flex;flex-direction:column;gap:10px}.media-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px;border:1px solid var(--ink-15);border-radius:var(--r-md);background:var(--white)}.media-row img{width:92px;height:58px;object-fit:cover;border-radius:var(--r-sm);background:var(--ink-07)}.media-row-main{min-width:0;display:flex;flex-direction:column;gap:2px}.media-row-main strong{font-size:13px}.media-row-main small{font-size:11px;color:var(--ink-50);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-row-actions{display:flex;gap:6px}@media(max-width:900px){.media-admin-grid{grid-template-columns:1fr}}@media(max-width:600px){.media-row{grid-template-columns:76px minmax(0,1fr)}.media-row img{width:76px;height:52px}.media-row-actions{grid-column:1/-1;justify-content:flex-end}}
'''
          css.write_text(c)

          # Homepage: dynamic ads replace hardcoded slider contents while retaining fallback.
          home = Path('index.html')
          x = home.read_text()
          x = re.sub(r'(<div class="slider">)\s*<div class="slide">\s*<img src="img/IMG_6815\.png"[\s\S]*?</div>\s*<!-- เพิ่มรูปอื่นๆ ได้ที่นี่ -->\s*<!-- [\s\S]*? -->', r'\1\n                <div class="slide" data-fallback-slide><img src="img/IMG_6815.png" alt="โครงการ" loading="eager" decoding="async" fetchpriority="high"></div>', x, count=1)
          home.write_text(x)

          indexjs = Path('JavaScript/index.js')
          q = indexjs.read_text()
          q = q.replace("const slides = document.querySelectorAll('.slide');", "let slides = document.querySelectorAll('.slide');")
          if 'async function loadHomepageAds()' not in q:
              q = q.replace('            // Initialize Auth0 using central script\n            initAuth();', '            loadHomepageAds();\n\n            // Initialize Auth0 using central script\n            initAuth();')
              inject = r'''
        async function loadHomepageAds() {
            try {
                const res = await fetch(`${API_BASE_URL}/ads`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const ads = await res.json();
                if (!Array.isArray(ads) || !ads.length) return;
                const slider = document.querySelector('.slider');
                slider.innerHTML = ads.map(ad => {
                    const image = `<img src="${ad.image_url}" alt="${String(ad.title || 'ประกาศ').replace(/"/g, '&quot;')}" loading="lazy" decoding="async">`;
                    return `<div class="slide">${ad.link_url ? `<a href="${ad.link_url}" target="_blank" rel="noopener noreferrer sponsored">${image}</a>` : image}</div>`;
                }).join('');
                slides = document.querySelectorAll('.slide');
                currentSlide = 0;
                dotsContainer.innerHTML = '';
                slides.forEach((_, index) => {
                    const dot = document.createElement('span');
                    dot.classList.add('dot');
                    if (index === 0) dot.classList.add('active');
                    dot.onclick = () => goToSlide(index);
                    dotsContainer.appendChild(dot);
                });
                updateSlider();
                document.querySelectorAll('.slider-btn').forEach(btn => btn.style.display = slides.length > 1 ? '' : 'none');
                dotsContainer.style.display = slides.length > 1 ? '' : 'none';
                resetInterval();
            } catch (error) {
                console.warn('Homepage ads unavailable; using fallback slide', error);
            }
        }

'''
              q = q.replace('        // Slider functionality\n', inject + '        // Slider functionality\n')
          indexjs.write_text(q)

          # Cache bump
          sw = Path('service-worker.js')
          if sw.exists():
              w = sw.read_text()
              w = re.sub(r"const CACHE_NAME = 'sorasukt-pwa-v(\d+)'", lambda m: f"const CACHE_NAME = 'sorasukt-pwa-v{int(m.group(1))+1}'", w, count=1)
              sw.write_text(w)
          PY
      - name: Validate
        run: |
          node --check worker/src/index.js
          node --check worker/src/handlers/media.js
          node --check JavaScript/admin.js
          node --check JavaScript/index.js
          grep -q 'CREATE TABLE IF NOT EXISTS site_ads' worker/schema.sql
          grep -q 'data-view="media"' admin.html
          grep -q 'id="view-media"' admin.html
          grep -q 'pathname === "/ads"' worker/src/index.js
          grep -q 'loadHomepageAds' JavaScript/index.js
      - name: Remove one-time workflow
        run: rm .github/workflows/admin-media-manager.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/schema.sql worker/src/index.js worker/src/handlers/media.js admin.html JavaScript/admin.js CSS/admin.css index.html JavaScript/index.js service-worker.js .github/workflows/admin-media-manager.yml
          git commit -m "Add Admin media uploads for OG images and homepage ads"
          git push origin HEAD:improve/admin-data-workflow
