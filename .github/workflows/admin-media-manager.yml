name: Admin media manager migration
on:
  push:
    branches: ["improve/admin-data-workflow"]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/admin-data-workflow
      - name: Apply media manager
        run: python3 .github/scripts/admin_media_migration.py
      - name: Validate
        run: |
          node --check worker/src/index.js
          node --check worker/src/handlers/media.js
          node --check JavaScript/admin.js
          node --check JavaScript/index.js
          grep -q 'CREATE TABLE IF NOT EXISTS site_ads' worker/schema.sql
          grep -q 'data-view="media"' admin.html
          grep -q 'id="view-media"' admin.html
          grep -q 'pathname === "/ads"' worker/src/index.js
          grep -q 'loadHomepageAds' JavaScript/index.js
      - name: Remove migration files
        run: rm .github/workflows/admin-media-manager.yml .github/scripts/admin_media_migration.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Admin media uploads for OG images and homepage ads"
          git push origin HEAD:improve/admin-data-workflow
