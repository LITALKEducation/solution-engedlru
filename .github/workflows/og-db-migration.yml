name: OG database migration
on:
  push:
    branches: ["improve/admin-data-workflow"]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/admin-data-workflow
      - name: Apply OG database migration
        run: python3 .github/scripts/og_migrate.py
      - name: Validate
        run: |
          node --check worker/src/index.js
          node --check worker/src/handlers/og.js
          grep -q "site_og_images" worker/schema.sql
          grep -q "engedlru-api.stnetworld.workers.dev/og/image?page=home" index.html
          grep -q "engedlru-api.stnetworld.workers.dev/og/image?page=checkup" checkup.html
      - name: Remove migration files
        run: rm .github/workflows/og-db-migration.yml .github/scripts/og_migrate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/schema.sql worker/src/index.js worker/src/handlers/og.js index.html checkup.html card.html sys.html service-worker.js .github/workflows/og-db-migration.yml .github/scripts/og_migrate.py
          git commit -m "Serve Open Graph images from D1 and R2"
          git push origin HEAD:improve/admin-data-workflow
