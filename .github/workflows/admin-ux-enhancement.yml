name: Admin UX enhancement
on:
  push:
    branches: ["improve/admin-data-workflow"]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/admin-data-workflow
      - name: Apply enhancement
        run: python3 .github/scripts/admin_enhance.py
      - name: Validate
        run: |
          node --check JavaScript/admin.js
          grep -q "Export ตามกิจกรรม" admin.html
          grep -q "ADMIN PRODUCTIVITY ENHANCEMENTS" JavaScript/admin.js
      - name: Remove migration files
        run: rm .github/workflows/admin-ux-enhancement.yml .github/scripts/admin_enhance.py
      - name: Commit enhancement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html JavaScript/admin.js CSS/admin.css service-worker.js .github/workflows/admin-ux-enhancement.yml .github/scripts/admin_enhance.py
          git commit -m "Improve admin data workflow and activity exports"
          git push origin HEAD:improve/admin-data-workflow
