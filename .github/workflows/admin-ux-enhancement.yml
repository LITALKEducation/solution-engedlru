      - name: Validate
        run: |
          node --check JavaScript/admin.js
          grep -q "Export ตามกิจกรรม" admin.html
          grep -q "ADMIN PRODUCTIVITY ENHANCEMENTS" JavaScript/admin.js
      - name: Remove one-time workflow
        run: rm .github/workflows/admin-ux-enhancement.yml
      - name: Commit enhancement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html JavaScript/admin.js CSS/admin.css service-worker.js .github/workflows/admin-ux-enhancement.yml
          git commit -m "Improve admin data workflow and activity exports"
          git push origin HEAD:improve/admin-data-workflow
