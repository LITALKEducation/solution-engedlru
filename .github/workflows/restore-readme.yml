name: Restore README
on:
  push:
    branches: ["improve/admin-data-workflow"]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/admin-data-workflow
          fetch-depth: 0
      - name: Restore README from main
        run: git checkout origin/main -- README.md
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/restore-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/restore-readme.yml
          git commit -m "Restore README unchanged"
          git push origin HEAD:improve/admin-data-workflow
