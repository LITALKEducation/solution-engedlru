<style>footer{display:none}
#dash{max-width:1040px;margin:0 auto;padding:24px 24px 0}
.dtop{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.dchip{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:800;font-size:.9rem;background:#fff}.dchip.open{background:#dcfce7;color:#15803d;border-color:#15803d}.dchip.closed{background:#fee2e2;color:#b91c1c;border-color:#b91c1c}
.dmute{color:#6b6464;font-size:.9rem}
.dstats{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}@media(min-width:700px){.dstats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dstat,.dcard{background:#fff;border:2px solid var(--accent);border-radius:var(--r);box-shadow:var(--hard);padding:16px 20px}
.dstat span{display:block;font-size:.875rem;font-weight:700;color:#6b6464}.dstat b{display:block;font-size:2.6rem;line-height:1.2;color:var(--accent);font-variant-numeric:tabular-nums}.dstat small{display:block;color:#6b6464;margin-bottom:8px}
.dbar{height:10px;border-radius:99px;background:var(--soft,#f3e7e5);overflow:hidden}.dbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.dcols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}@media(min-width:800px){.dcols{grid-template-columns:3fr 2fr}}
.dcard h2{margin:0 0 12px;font-size:1.05rem}.dlist,.drecent{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.dh{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px;flex-wrap:wrap}.dh span{color:#6b6464;font-size:.9rem}.dlist .full .dh span{color:#b91c1c;font-weight:700}
.drecent li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.92rem;border-bottom:1px solid #eee;padding-bottom:8px}.drecent .dt{color:#6b6464}.drecent .dd{grid-column:2;color:var(--accent);font-weight:700}
.dbtn{border:0;border-radius:999px;min-height:46px;padding:0 22px;font:inherit;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px}
</style>
