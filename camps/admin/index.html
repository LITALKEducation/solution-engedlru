body{background:#fff}
.ad{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 40px}
.ad .back{display:inline-block;color:var(--mute);font-weight:600;font-size:14px;padding:6px 0}

.ad ul{list-style:none;margin:0;padding:6px;border-radius:32px;border:1px solid var(--glass-edge);background:linear-gradient(135deg,var(--glass-hi),var(--glass-lo));box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.ad li a{border-radius:26px}
.ad li a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:10px 18px;font-weight:600}
.ad li a small{color:var(--mute);font-weight:400;font-size:14px}
.ad li a:hover{background:var(--panel)}
.ad li a::after{content:"\2192";flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:1rem}
.ad li a span{flex:1}
