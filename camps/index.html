<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/assets/inapp-guard.js?v=903ca2b3"></script>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>Camps · กิจกรรมค่าย</title>
<link rel="icon" type="image/png" href="/icons/branch-64.png">
<link rel="apple-touch-icon" href="/icons/branch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=25a208f5">
<link rel="stylesheet" href="/assets/theme.css?v=4">
<style>
.home{max-width:560px;margin:0 auto;padding:96px 24px 112px;flex:1;width:100%}
.tagp{display:inline-block;padding:6px 14px;border-radius:8px;background:var(--soft);color:var(--soft-ink);font-size:.875rem;font-weight:600}
.home h1{font-family:var(--serif);font-size:clamp(2.5rem,11vw,3.5rem);font-weight:800;line-height:1.1;margin:1rem 0 .5rem;color:var(--ink)}
.state{min-height:1.75rem;color:var(--mute);font-size:1rem;margin:0 0 1.5rem}
.panel2{background:#fff;border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(20,16,16,.05)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:16px}
.row2 b{font-size:1.125rem}.row2 span{color:var(--mute);font-size:.875rem}
.meter{margin-top:14px;height:6px;border-radius:3px;background:#e6e1e1;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s ease-out}
.go{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;min-height:52px;border-radius:var(--r);background:var(--accent);color:#fff;font-weight:700;font-size:1.0625rem;text-decoration:none}
.go:hover{background:var(--accent-d)}
.go:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
.tabbar>div{display:flex;width:100%;max-width:560px}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 12px;min-height:64px;border:0;background:none;color:#6e6364;font:inherit;font-size:.75rem;font-weight:600;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{color:var(--accent)}
footer{max-width:560px;margin:0 auto;width:100%;text-align:left;padding:0 24px 96px;color:var(--mute)}
footer a{color:var(--mute);text-decoration:underline}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
<script src="/assets/brand-bar.js?v=3a855dc3" defer></script>
</head>
<body>
<a class="skip" href="#main">ข้ามไปเนื้อหาหลัก</a>
<div class="shell">
<main id="main" tabindex="-1" class="home">
<span class="tagp" id="grp"></span>
<h1 id="ttl"></h1>
<p class="state" id="state"></p>
<section class="panel2" id="stage" role="tabpanel" aria-live="polite">
<div class="row2"><b id="lbl">ระบบ</b><span id="cnt"></span></div>
<div class="meter" aria-hidden="true"><i id="mt"></i></div>
<a class="go" id="go" href="/">เปิด &rarr;</a>
</section>
<noscript><ul><li><a href="/hr/">เลือกฝ่าย</a></li><li><a href="/aka/">ตั้งชื่อ AKA</a></li><li><a href="/lotto/">จับสลาก</a></li><li><a href="/qrcheck/">เช็ก QR</a></li><li><a href="/budget/">งบประมาณ</a></li></ul></noscript>
</main>
<footer>© English Education · LRU · <a href="/admin/" style="text-decoration:underline">แอดมิน</a></footer>
</div>
<nav class="tabbar" aria-label="ระบบ"><div role="tablist" id="tabs"></div></nav>
<script>
(function(){
var ICONS={"hr": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6\"/><circle cx=\"17.5\" cy=\"9\" r=\"2.5\"/><path d=\"M17 14c2.8.2 4.5 2.1 4.5 5\"/></svg>", "aka": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12V8l-6-6H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6\"/><path d=\"M14 2v6h6\"/><path d=\"m16 19 2 2 4-4\"/></svg>", "lotto": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 8v8M8 12h8\"/></svg>", "qr": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2\"/><path d=\"M7 12h10\"/></svg>", "bud": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z\"/><path d=\"M3 7l12-4v4\"/><circle cx=\"16.5\" cy=\"13.5\" r=\"1.2\"/></svg>"};
var items=[
 {t:"เลือกฝ่าย",g:"นักศึกษา",h:"/hr/",i:"hr"},
 {t:"ตั้งชื่อ AKA",g:"นักศึกษา",h:"/aka/",i:"aka"},
 {t:"จับสลาก",g:"เจ้าหน้าที่",h:"/lotto/",i:"lotto"},
 {t:"เช็ก QR",g:"เจ้าหน้าที่",h:"/qrcheck/",i:"qr"},
 {t:"งบประมาณ",g:"การเงิน",h:"/budget/",i:"bud"}];
var cur=0,bar=document.getElementById("tabs"),btns=[];
items.forEach(function(it,i){var b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");b.id="tab"+i;
 b.innerHTML=ICONS[it.i]+"<span>"+it.t+"</span>";
 b.addEventListener("click",function(){sel(i,false)});
 b.addEventListener("keydown",function(e){var d=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(d){e.preventDefault();sel((cur+d+items.length)%items.length,true)}});
 bar.appendChild(b);btns.push(b)});
function sel(i,focus){cur=i;var it=items[i];
 btns.forEach(function(b,k){b.setAttribute("aria-selected",k===i?"true":"false");b.tabIndex=k===i?0:-1});
 document.getElementById("stage").setAttribute("aria-labelledby","tab"+i);
 document.getElementById("grp").textContent=it.g;document.getElementById("cnt").textContent=(i+1)+" / "+items.length;
 document.getElementById("mt").style.width=((i+1)/items.length*100)+"%";
 document.getElementById("ttl").textContent=it.t;document.getElementById("lbl").textContent=it.g;document.getElementById("go").href=it.h;
 document.getElementById("state").textContent=it.s||"";
 if(focus)btns[i].focus()}
sel(0,false);
// Registration status for "เลือกฝ่าย" (pending | open | closed). Failure keeps the page as is.
var API=window.CAMPS_API||"https://engedlru-api.stnetworld.workers.dev";
fetch(API+"/camps/status").then(function(r){return r.ok?r.json():null}).then(function(d){if(!d)return;
 items[0].s=d.registration==="open"?"เปิดลงทะเบียน":d.registration==="closed"?"ปิดลงทะเบียนแล้ว":"เร็วๆ นี้";
 if(cur===0)document.getElementById("state").textContent=items[0].s}).catch(function(){});
})();
</script>
</body></html>
