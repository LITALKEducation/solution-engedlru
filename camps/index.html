<script>
// Registration status badge for "เลือกฝ่าย". Failure keeps the static text.
(function(){var API=window.CAMPS_API||"https://engedlru-api.stnetworld.workers.dev";
fetch(API+"/camps/status").then(function(r){return r.ok?r.json():null}).then(function(d){if(!d)return;
var b=document.getElementById("hrBadge");
if(d.registration==="open"){b.textContent="เปิดลงทะเบียน";b.className="badge open"}
else if(d.registration==="closed"){b.textContent="ปิดแล้ว";b.className="badge closed"}
}).catch(function(){})})();
</script>
