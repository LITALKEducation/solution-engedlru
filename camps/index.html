<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/assets/inapp-guard.js?v=903ca2b3"></script>
<meta name="theme-color" content="#3a1b16">
<meta name="robots" content="noindex,nofollow">
<title>Camps · กิจกรรมค่าย</title>
<link rel="icon" type="image/png" href="/icons/branch-64.png">
<link rel="apple-touch-icon" href="/icons/branch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=25a208f5">
<link rel="stylesheet" href="/assets/theme.css?v=2">
<style>
.home{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 24px 24px;flex:1;width:100%}
.brand{font-size:clamp(2.5rem,10vw,3.5rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;color:#fff;margin:0 0 .5rem}
.brand+p{margin:0 0 2.5rem;color:var(--mute);font-size:1rem}
.grp{margin-top:2rem}
.grp h2{font-size:.875rem;font-weight:600;color:var(--mute);margin:0 0 .75rem 4px}
.grp ul{list-style:none;margin:0;padding:6px;border-radius:32px;border:1px solid var(--glass-edge);background:linear-gradient(135deg,var(--glass-hi),var(--glass-lo)),var(--glass-tint);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.22);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;min-height:60px;font-size:1.125rem;font-weight:600;color:#fff;text-decoration:none;border-radius:26px}
.row::after{content:"\2192";flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--cream);color:var(--dark);font-size:1.1rem;transition:transform .2s ease-out}
.row:hover{background:rgba(255,255,255,.14)}
.row:hover::after{transform:translateX(3px)}
.badge{margin-left:.5rem;font-size:.8125rem;padding:2px 12px}
footer{max-width:640px;margin:0 auto;width:100%;text-align:left;padding:1rem 28px calc(env(safe-area-inset-bottom,0px) + 24px);color:var(--mute)}
footer a{color:var(--mute);text-decoration:underline}
</style>
<script src="/assets/brand-bar.js?v=3a855dc3" defer></script>
</head>
<body>
<a class="skip" href="#main">ข้ามไปเนื้อหาหลัก</a>
<div class="shell">
<main id="main" tabindex="-1" class="home">
<h1 class="brand">Camps</h1>
<p>กิจกรรมค่าย</p>
<section class="grp" aria-labelledby="g1"><h2 id="g1">นักศึกษา</h2>
<ul>
<li><a class="row" href="/hr/"><span>เลือกฝ่าย <span class="badge" id="hrBadge">เร็วๆ นี้</span></span></a></li>
<li><a class="row" href="/aka/"><span>ตั้งชื่อ AKA</span></a></li>
</ul></section>
<section class="grp" aria-labelledby="g2"><h2 id="g2">เจ้าหน้าที่</h2>
<ul>
<li><a class="row" href="/lotto/"><span>จับสลาก</span></a></li>
<li><a class="row" href="/qrcheck/"><span>เช็ก QR</span></a></li>
</ul></section>
<section class="grp" aria-labelledby="g3"><h2 id="g3">การเงิน</h2>
<ul>
<li><a class="row" href="/budget/"><span>งบประมาณ</span></a></li>
</ul></section>
</main>
<footer>© English Education · LRU · <a href="/admin/" style="text-decoration:underline">แอดมิน</a></footer>
</div>
<script>
// Registration status badge for the "เลือกฝ่าย" row. Failure keeps the static text.
(function(){var API=window.CAMPS_API||"https://engedlru-api.stnetworld.workers.dev";
fetch(API+"/camps/status").then(function(r){return r.ok?r.json():null}).then(function(d){if(!d)return;
var b=document.getElementById("hrBadge");
if(d.registration==="open"){b.textContent="เปิดลงทะเบียน";b.className="badge open"}
else if(d.registration==="closed"){b.textContent="ปิดแล้ว";b.className="badge closed"}
}).catch(function(){})})();
</script>
</body></html>
