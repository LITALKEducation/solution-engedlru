<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/assets/inapp-guard.js?v=903ca2b3"></script>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>Camps · กิจกรรมค่าย</title>
<link rel="icon" type="image/png" href="/icons/branch-64.png">
<link rel="apple-touch-icon" href="/icons/branch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=25a208f5">
<style>
:root{--red:#c62828;--red-d:#9f1d1d;--ink:#171212;--mute:#5c5254}
body{background:#fff;color:var(--ink)}
.home{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 24px 24px;flex:1;width:100%}
.brand{font-size:clamp(2rem,6vw,2.75rem);font-weight:700;line-height:1.1;color:var(--red);margin:0 0 .5rem;letter-spacing:-.01em}
.brand+p{margin:0 0 3rem;color:var(--mute);font-size:1rem}
.grp{margin-top:2.25rem}
.grp h2{font-size:.875rem;font-weight:600;color:var(--mute);margin:0 0 .5rem}
.grp ul{list-style:none;margin:0;padding:0;border-top:2px solid var(--red)}
.grp li{border-bottom:1px solid #e6dede}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:1rem 0;min-height:56px;font-size:1.125rem;font-weight:600;color:var(--ink);text-decoration:none}
.row::after{content:"\2192";color:var(--red);font-size:1.25rem;flex:none;transition:transform .2s ease-out}
.row:hover{color:var(--red-d)}
.row:hover::after{transform:translateX(4px)}
.row:focus-visible,.skip:focus-visible,footer a:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:2px}
.badge{margin-left:.5rem;border:1px solid var(--mute);color:var(--mute);font-weight:600;font-size:.8125rem;padding:2px 10px;border-radius:999px}
.badge.open{border-color:var(--red);background:var(--red);color:#fff}
.badge.closed{border-color:var(--mute);color:var(--mute)}
footer{max-width:640px;margin:0 auto;width:100%;text-align:left;padding:1rem 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
footer a{color:var(--mute);text-decoration:underline}
@media(prefers-reduced-motion:reduce){.row::after{transition:none}}
</style>
<script src="/assets/brand-bar.js?v=3a855dc3" defer></script>
</head>
<body>
<a class="skip" href="#main">ข้ามไปเนื้อหาหลัก</a>
<div class="shell">
<main id="main" tabindex="-1" class="home">
<h1 class="brand">Camps</h1>
<p>กิจกรรมค่าย</p>
<section class="grp" aria-labelledby="g1"><h2 id="g1">นักศึกษา</h2>
<ul>
<li><a class="row" href="/hr/"><span>เลือกฝ่าย <span class="badge" id="hrBadge">เร็วๆ นี้</span></span></a></li>
<li><a class="row" href="/aka/"><span>ตั้งชื่อ AKA</span></a></li>
</ul></section>
<section class="grp" aria-labelledby="g2"><h2 id="g2">เจ้าหน้าที่</h2>
<ul>
<li><a class="row" href="/lotto/"><span>จับสลาก</span></a></li>
<li><a class="row" href="/qrcheck/"><span>เช็ก QR</span></a></li>
</ul></section>
<section class="grp" aria-labelledby="g3"><h2 id="g3">การเงิน</h2>
<ul>
<li><a class="row" href="/budget/"><span>งบประมาณ</span></a></li>
</ul></section>
</main>
<footer>© English Education · LRU · <a href="/admin/" style="text-decoration:underline">แอดมิน</a></footer>
</div>
<script>
// Registration status badge for the "เลือกฝ่าย" row. Failure keeps the static text.
(function(){var API=window.CAMPS_API||"https://engedlru-api.stnetworld.workers.dev";
fetch(API+"/camps/status").then(function(r){return r.ok?r.json():null}).then(function(d){if(!d)return;
var b=document.getElementById("hrBadge");
if(d.registration==="open"){b.textContent="เปิดลงทะเบียน";b.className="badge open"}
else if(d.registration==="closed"){b.textContent="ปิดแล้ว";b.className="badge closed"}
}).catch(function(){})})();
</script>
</body></html>
